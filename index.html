        // ----- helper: shuffle array (Fisher–Yates) -----
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ----- build question objects with shuffled options -----
        function buildShuffledQuestions() {
            return rawQuestions.map((item, idx) => {
                const correctRaw = item.options.find(opt => opt.startsWith('+'));
                const correctValue = correctRaw ? correctRaw.substring(1).trim() : '';

                const optionObjs = item.options.map(opt => {
                    const isCorrect = opt.startsWith('+');
                    const label = opt.substring(1).trim();
                    return { label, isCorrect };
                });

                const shuffled = shuffleArray([...optionObjs]);

                return {
                    id: idx,
                    question: item.q,
                    options: shuffled,
                    correctValue: correctValue
                };
            });
        }

        // ----- state -----
        let questions = buildShuffledQuestions();

        // ----- check individual answer instantly -----
        function checkSingleAnswer(radio) {
            const questionId = radio.name.replace('q', '');
            const questionDiv = radio.closest('.question-card');
            if (!questionDiv) return;

            // Remove previous highlights and badges for this question only
            questionDiv.querySelectorAll('.option.correct-highlight, .option.wrong-highlight').forEach(el => {
                el.classList.remove('correct-highlight', 'wrong-highlight');
            });
            questionDiv.querySelectorAll('.result-badge').forEach(el => el.remove());

            const allOptions = questionDiv.querySelectorAll('.option');
            const selectedOption = radio.closest('.option');
            const isCorrect = selectedOption && selectedOption.dataset.correct === 'true';

            // Show the correct answer (highlight green)
            allOptions.forEach(opt => {
                if (opt.dataset.correct === 'true') {
                    opt.classList.add('correct-highlight');
                }
            });

            // Show user's result
            if (isCorrect) {
                const badge = document.createElement('span');
                badge.className = 'result-badge correct';
                badge.textContent = 'Correct';
                selectedOption.appendChild(badge);
            } else {
                if (selectedOption) {
                    selectedOption.classList.add('wrong-highlight');
                    const badge = document.createElement('span');
                    badge.className = 'result-badge wrong';
                    badge.textContent = 'Wrong';
                    selectedOption.appendChild(badge);
                }
            }

            // Show hint (correct answer text)
            const hint = document.getElementById(`hint-${questionId}`);
            if (hint) hint.classList.add('show');

            updateScore();
        }

        // ----- show all correct answers (without affecting user selections) -----
        function showAllAnswers() {
            questions.forEach(q => {
                const questionDiv = document.querySelector(`.question-card[data-qid="${q.id}"]`);
                if (!questionDiv) return;

                // Highlight correct options
                questionDiv.querySelectorAll('.option').forEach(opt => {
                    if (opt.dataset.correct === 'true') {
                        opt.classList.add('correct-highlight');
                    }
                });

                // Show hint
                const hint = document.getElementById(`hint-${q.id}`);
                if (hint) hint.classList.add('show');
            });
        }

        // ----- render -----
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            let html = '';

            questions.forEach((q, index) => {
                const qNum = index + 1;
                html += `<div class="question-card" data-qid="${q.id}">`;
                html += `<div class="q-text"><span class="q-number">${qNum}.</span> ${q.question}</div>`;
                html += `<div class="options">`;

                q.options.forEach((opt, optIdx) => {
                    const optionId = `q${q.id}_opt${optIdx}`;
                    html += `<div class="option" data-correct="${opt.isCorrect}" data-qid="${q.id}">`;
                    html += `<input type="radio" name="q${q.id}" id="${optionId}" value="${opt.label}">`;
                    html += `<label for="${optionId}">${opt.label}</label>`;
                    html += `</div>`;
                });

                html += `</div>`;
                html += `<div class="answer-hint" id="hint-${q.id}">✔ Correct answer: ${q.correctValue}</div>`;
                html += `</div>`;
            });

            container.innerHTML = html;
            document.querySelectorAll('.answer-hint').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('.result-badge').forEach(el => el.remove());
            updateScore();
        }

        // ----- update score (counts only answered questions) -----
        function updateScore() {
            const allRadios = document.querySelectorAll('input[type="radio"]:checked');
            let correct = 0;
            const answeredNames = new Set();
            allRadios.forEach(radio => {
                const name = radio.name;
                answeredNames.add(name);
                const parentOpt = radio.closest('.option');
                if (parentOpt && parentOpt.dataset.correct === 'true') {
                    correct++;
                }
            });
            const total = answeredNames.size;
            document.getElementById('scoreDisplay').textContent = `${correct} / ${total}`;
        }

        // ----- reset: rebuild shuffled questions, re-render -----
        function resetQuiz() {
            questions = buildShuffledQuestions();
            renderQuiz();
            document.getElementById('scoreDisplay').textContent = '0 / 0';
        }

        // ----- event listeners -----
        document.addEventListener('DOMContentLoaded', function() {
            renderQuiz();

            // "Show all correct answers" button
            document.getElementById('showAllBtn').addEventListener('click', showAllAnswers);

            // Reset button
            document.getElementById('resetBtn').addEventListener('click', resetQuiz);

            // Live check on radio change (instant feedback)
            document.addEventListener('change', function(e) {
                if (e.target && e.target.type === 'radio') {
                    checkSingleAnswer(e.target);
                }
            });
        });

    })();
