<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatika Olimpiada - Tuman Bosqichi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 600;
        }

        .timer {
            font-size: 24px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            min-width: 120px;
            text-align: center;
        }

        .timer.warning {
            background: #e74c3c;
        }

        .content {
            padding: 50px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .question-container {
            margin-bottom: 50px;
            padding: 25px;
            border-left: 5px solid #2c3e50;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .question-number {
            color: #2c3e50;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-points {
            background: #2c3e50;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .question-text {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 25px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            display: flex;
            align-items: flex-start;
            padding: 16px 18px;
            border: 2px solid #d0d0d0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .option:hover {
            border-color: #2c3e50;
            background: #f0f5f9;
        }

        .option input[type="radio"] {
            margin-right: 14px;
            margin-top: 2px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: #2c3e50;
            flex-shrink: 0;
        }

        .option label {
            cursor: pointer;
            flex: 1;
            user-select: none;
            color: #333;
            font-size: 15px;
            line-height: 1.6;
        }

        .option.selected {
            border-color: #2c3e50;
            background: #e8f4f8;
        }

        .option.selected label {
            color: #2c3e50;
            font-weight: 600;
        }

        .footer {
            padding: 30px 50px;
            background: #f9f9f9;
            display: flex;
            gap: 20px;
            justify-content: flex-end;
            border-top: 1px solid #e0e0e0;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(44, 62, 80, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-reset {
            background: #ecf0f1;
            color: #2c3e50;
        }

        .btn-reset:hover {
            background: #d5dbdd;
        }

        .results {
            display: none;
            text-align: center;
            padding: 50px;
        }

        .results.show {
            display: block;
        }

        .score-display {
            font-size: 56px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .score-display.high {
            color: #27ae60;
        }

        .score-display.low {
            color: #e74c3c;
        }

        .results-text {
            font-size: 18px;
            color: #555;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .results-info {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 8px;
            margin-top: 25px;
            border-left: 5px solid #2c3e50;
            text-align: left;
            display: inline-block;
        }

        .results-info p {
            margin: 10px 0;
            font-size: 16px;
            color: #333;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2c3e50 0%, #34495e 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .answered-counter {
            font-size: 14px;
            color: #666;
            margin-top: 25px;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
                padding: 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .content {
                padding: 25px;
            }

            .question-container {
                margin-bottom: 35px;
                padding: 18px;
            }

            .footer {
                flex-direction: column;
                padding: 20px 25px;
            }

            .results {
                padding: 30px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Informatika Olimpiada</h1>
                <p style="font-size: 14px; margin-top: 5px;">Tuman Bosqichi - 30 ta savol</p>
            </div>
            <div class="timer" id="timer">90:00</div>
        </div>

        <div class="content" id="content">
            <div id="questions-container"></div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="answered-counter" id="answered-counter">Javoblar: 0/30</div>
        </div>

        <div class="results" id="results">
            <h2 style="margin-bottom: 20px;">Test Natijalari</h2>
            <div class="score-display" id="score-display">0%</div>
            <div class="results-text" id="results-message"></div>
            <div class="results-info">
                <p id="results-details"></p>
            </div>
        </div>

        <div class="footer">
            <button class="btn-reset" onclick="resetQuiz()">Qayta boshlash</button>
            <button class="btn-submit" onclick="submitQuiz()">Testni tugatish</button>
        </div>
    </div>

    <script>
        const questions = [
            // 1-qism: 0.9 ball
            {
                question: "Google kompaniyasi rasman qachon ro'yxatdan o'tgan?",
                options: ["2003-yil 14-fevral", "1999-yil 4-sentabr", "2004-yil 4-mart", "1998-yil 4-sentabr"],
                correct: 1,
                points: "0.9 ball",
                section: "1-qism"
            },
            {
                question: "CMS platformasining vazifasiga ko'ra turlarini aniqlang.",
                options: ["Ochiq va yopiq kodli", "Yuqori ixtisoslashgan va universal", "cMOOC va xMOOC", "LMS va MOOC"],
                correct: 3,
                points: "0.9 ball",
                section: "1-qism"
            },
            {
                question: "Dastur natijasini aniqlang:\nx='Python dasturlash tili'\nprint('python' in x)",
                options: ["false", "true", "python", "dasturlash tili"],
                correct: 1,
                points: "0.9 ball",
                section: "1-qism"
            },
            {
                question: "Birinchi web-sayt nomi keltirilgan qatorni toping.",
                options: ["info.cern.ch", "web.cern.org", "tim.org.ch", "ms.dos.org"],
                correct: 0,
                points: "0.9 ball",
                section: "1-qism"
            },
            {
                question: "Ms Word dasturida qaysi tugmalar yordamida matnga joriy vaqtni (soat) kiritish mumkin?",
                options: ["Shift+Ctrl+T", "Shift+Tab+D", "Shift+Alt+D", "Shift+Alt+T"],
                correct: 3,
                points: "0.9 ball",
                section: "1-qism"
            },
            {
                question: "Quyidagilardan qaysi biri Python dasturlash tili moduli emas?",
                options: ["locale", "tkinter", "os", "ceil"],
                correct: 3,
                points: "0.9 ball",
                section: "1-qism"
            },
            {
                question: "Dastur natijasini aniqlang: print(-9//2)",
                options: ["4", "-4", "-5", "5"],
                correct: 2,
                points: "0.9 ball",
                section: "1-qism"
            },
            {
                question: "Dastur natijasini toping:\na=0x1122\nprint(a)",
                options: ["1122", "10442", "4386", "0"],
                correct: 1,
                points: "0.9 ball",
                section: "1-qism"
            },
            {
                question: "Quyidagi formula natijasini aniqlang:\n=КОРЕНЬ(НОК(60;45;80)+ДЛСТР(ПРАВСИМВ(\"texnologiyalar\";9)))",
                options: ["27", "23", "18", "16"],
                correct: 1,
                points: "0.9 ball",
                section: "1-qism"
            },
            {
                question: "Power Point dasturi slaydlar namoyishi rejimida bitta oldingi slaydga klaviaturaning qaysi tugmasi yordamida o'tiladi?",
                options: ["Ctrl+B", "P", "B", "Alt+P"],
                correct: 2,
                points: "0.9 ball",
                section: "1-qism"
            },

            // 2-qism: 1.5 ball
            {
                question: "Dastur natijasini aniqlang:\nprint((lambda x: x**3)(lambda x: x+2)(2))\nprint((lambda x: x**3)(lambda x: x+3)(3))",
                options: ["4, 6", "4, 7", "64, 216", "TypeError"],
                correct: 3,
                points: "1.5 ball",
                section: "2-qism"
            },
            {
                question: "Natijani aniqlang:\ns={2,0,3,1, 4}\nprint(s[-2])",
                options: ["0", "1", "3", "Dastur xato"],
                correct: 3,
                points: "1.5 ball",
                section: "2-qism"
            },
            {
                question: "Natijani aniqlang:\na = 10\nprint(~a)",
                options: ["False", "True", "-10", "-11"],
                correct: 3,
                points: "1.5 ball",
                section: "2-qism"
            },
            {
                question: "MP3 formatida qo'llab-quvvatlanadigan eng yuqori audio sifati necha kbps bo'ladi?",
                options: ["256 kbps", "320 kbps", "480 kbps", "96 kbps"],
                correct: 1,
                points: "1.5 ball",
                section: "2-qism"
            },
            {
                question: "Dastur natijasini aniqlang: print(-12|-8)",
                options: ["-4", "False", "-12", "True"],
                correct: 3,
                points: "1.5 ball",
                section: "2-qism"
            },
            {
                question: "Dastur natijasini toping:\na = b'informatika'\nprint(a)",
                options: ["informatika", "b'informatika'", "binformatika", "TypeError"],
                correct: 1,
                points: "1.5 ball",
                section: "2-qism"
            },
            {
                question: "Dastur natijasini toping:\nfirst = 'python'\nsecond = ' '\nfor i in first:\n    second = i + second\nprint(second)",
                options: ["nohtyp", "pythonpythonpythonpythonpython", "iiiiii", "python"],
                correct: 0,
                points: "1.5 ball",
                section: "2-qism"
            },
            {
                question: "Natijani toping: print(int(True))",
                options: ["0", "True", "1", "TypeError"],
                correct: 2,
                points: "1.5 ball",
                section: "2-qism"
            },
            {
                question: "135, B6, 703 butun sonlarni barchasini yozish mumkin bo'lgan eng kichik asosli sanoq sistemasida shu sonlar yig'indisini hisoblang.",
                options: ["932", "1322", "922", "1232"],
                correct: 1,
                points: "1.5 ball",
                section: "2-qism"
            },
            {
                question: "O'n oltilik sanoq sistemasidagi 12B,84 sonini o'nlik sanoq sistemasida ifodalang.",
                options: ["292, 224511", "299, 515625", "464, 552718", "384, 452319"],
                correct: 1,
                points: "1.5 ball",
                section: "2-qism"
            },

            // 3-qism: 2.6 ball
            {
                question: "Dastur natijasini toping:\na=(1, 2, 3, 4, 5)\na.pop(2)\nprint(a)",
                options: ["(1, 2, 3)", "(3, 4, 5)", "(1, 2, 4, 5)", "AttributeError"],
                correct: 2,
                points: "2.6 ball",
                section: "3-qism"
            },
            {
                question: "Dastur natijasini aniqlang:\ndef func():\n    try:\n        return True\n    finally:\n        return False\nprint(func())",
                options: ["True", "True, False", "False", "False, True"],
                correct: 2,
                points: "2.6 ball",
                section: "3-qism"
            },
            {
                question: "Dastur natijasini toping:\na = 'informatika'\nfor i in range(len(a)):\n    a[i].upper()\nprint(a)",
                options: ["INFORMATIKA", "INFORMATIa", "informatika", "iNFORMATIKA"],
                correct: 2,
                points: "2.6 ball",
                section: "3-qism"
            },
            {
                question: "Dastur natijasini toping:\nx = 'abcdef'\ni = 'a'\nwhile i in x:\n    x=x[:-1]\n    print(i, end=' ')",
                options: ["aaaaa", "a a a a a a", "iiiii", "i i i i i"],
                correct: 1,
                points: "2.6 ball",
                section: "3-qism"
            },
            {
                question: "Dastur natijasini toping:\na = {1, 2, 3, 4}\nb = {5, 6, 7, 8}\nprint(len(a+b))",
                options: ["8", "TypeError", "4", "AttributeError"],
                correct: 1,
                points: "2.6 ball",
                section: "3-qism"
            },
            {
                question: "Natijani aniqlang: print(min(max(False, -3, -4), 2, 7))",
                options: ["-4", "False", "2", "TypeError"],
                correct: 2,
                points: "2.6 ball",
                section: "3-qism"
            },
            {
                question: "Natijani toping:\na = {1: 'A', 2: 'B', 3: 'C'}\nfor i, j in a.items():\n    print(i, j, end=' ')",
                options: ["A B C", "1 A 2 B 3 C", "1 2 3", "1 2 3 A B C"],
                correct: 1,
                points: "2.6 ball",
                section: "3-qism"
            },
            {
                question: "Dastur natijasini toping:\na = ['a', 'b', 'c', 'd', 'e']\nfor i in range(len(a)):\n    a[i] = chr(ord(a[i])+1)\nprint(a)",
                options: ["['b', 'c', 'd', 'e', 'f']", "a b c d e f", "[ 'b', 'c', 'd', 'e', 'f']", "['a', 'b', 'c', 'd', 'e', 'f']"],
                correct: 0,
                points: "2.6 ball",
                section: "3-qism"
            },
            {
                question: "O'lchami 1366x768 bo'lgan ekranda 16 xil rang aks etadi. Ekrandagi axborot hajmini Kbayt da aniqlang.",
                options: ["2049 Kbayt", "512.25 Kbayt", "1024.5 Kbayt", "4098 Kbayt"],
                correct: 1,
                points: "2.6 ball",
                section: "3-qism"
            },
            {
                question: "Musiqani yozish uchun maqbul sifat darajasini belgilang.",
                options: ["192 kbps", "256 kbps", "320 kbps", "96 kbps"],
                correct: 2,
                points: "2.6 ball",
                section: "3-qism"
            }
        ];

        let userAnswers = new Array(questions.length).fill(null);
        let timeLeft = 90 * 60;
        let timerInterval;
        let quizSubmitted = false;
        let shuffledQuestions = [];
        let questionIndices = [];

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function initQuiz() {
            questionIndices = Array.from({ length: questions.length }, (_, i) => i);
            questionIndices = shuffleArray(questionIndices);
            shuffledQuestions = questionIndices.map(i => ({ ...questions[i], originalIndex: i }));
            userAnswers = new Array(questions.length).fill(null);
            renderQuestions();
            startTimer();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            shuffledQuestions.forEach((q, displayIndex) => {
                const index = q.originalIndex;
                const div = document.createElement('div');
                div.className = 'question-container';
                
                div.innerHTML = `
                    <div class="question-header">
                        <div class="question-number">Savol ${displayIndex + 1}/30</div>
                        <span class="question-points">${q.points}</span>
                    </div>
                    <div class="question-text">${q.question}</div>
                    <div class="options" id="options-${index}">
                        ${q.options.map((option, optIndex) => `
                            <label class="option" id="option-${index}-${optIndex}">
                                <input type="radio" name="question-${index}" value="${optIndex}" 
                                    onchange="selectAnswer(${index}, ${optIndex})" 
                                    ${userAnswers[index] === optIndex ? 'checked' : ''}>
                                <span>${String.fromCharCode(65 + optIndex)}) ${option}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                container.appendChild(div);
            });

            updateProgress();
        }

        function selectAnswer(questionIndex, optionIndex) {
            userAnswers[questionIndex] = optionIndex;
            updateProgress();

            const optionLabel = document.getElementById(`option-${questionIndex}-${optionIndex}`);
            const allOptions = document.querySelectorAll(`[id^="option-${questionIndex}-"]`);
            allOptions.forEach(opt => opt.classList.remove('selected'));
            optionLabel.classList.add('selected');
        }

        function updateProgress() {
            const answered = userAnswers.filter(a => a !== null).length;
            const percentage = (answered / questions.length) * 100;

            document.getElementById('progress-fill').style.width = percentage + '%';
            document.getElementById('answered-counter').textContent = `Javoblar: ${answered}/30`;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;

                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                const timerDisplay = document.getElementById('timer');

                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

                if (timeLeft <= 300) {
                    timerDisplay.classList.add('warning');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz();
                }
            }, 1000);
        }

        function submitQuiz() {
            if (quizSubmitted) return;
            quizSubmitted = true;

            clearInterval(timerInterval);

            const correct = userAnswers.filter((answer, index) => answer !== null && answer === questions[index].correct).length;
            const percentage = Math.round((correct / questions.length) * 100);

            const scoreDisplay = document.getElementById('score-display');
            scoreDisplay.textContent = percentage + '%';

            if (percentage >= 80) {
                scoreDisplay.classList.add('high');
            } else if (percentage < 50) {
                scoreDisplay.classList.add('low');
            }

            const messagesMap = {
                100: "Ajoyib! Siz barcha savollarga to'g'ri javob berdingiz!",
                90: "Juda yaxshi natija! Siz 90% dan ortiq o'zingiz bilan!",
                80: "Yaxshi! Siz 80% yuqori natija oldinggiz.",
                70: "O'rta darajali natija. O'z bilimingizni ko'paytiring.",
                50: "Natija o'rta. Ko'proq o'zini tekshiring.",
                0: "Iloji bor qayta ko'paytirish. Bilimni o'rganing va qayta urinib ko'ring."
            };

            const message = Object.keys(messagesMap)
                .sort((a, b) => b - a)
                .find(score => percentage >= parseInt(score));

            document.getElementById('results-message').textContent = messagesMap[message];
            document.getElementById('results-details').innerHTML = `
                <strong>To'g'ri javoblar:</strong> ${correct}/30<br>
                <strong>Noto'g'ri javoblar:</strong> ${30 - correct}/30<br>
                <strong>Javob bermaganlar:</strong> ${userAnswers.filter(a => a === null).length}/30
            `;

            document.getElementById('questions-container').style.display = 'none';
            document.getElementById('results').classList.add('show');
            document.getElementById('submit-btn').style.display = 'none';
        }

        function resetQuiz() {
            userAnswers = new Array(questions.length).fill(null);
            quizSubmitted = false;
            timeLeft = 90 * 60;

            document.getElementById('questions-container').style.display = 'block';
            document.getElementById('results').classList.remove('show');
            document.getElementById('submit-btn').style.display = 'block';
            document.getElementById('timer').classList.remove('warning');

            renderQuestions();
            startTimer();
        }

        window.addEventListener('load', initQuiz);
    </script>
</body>
</html>
